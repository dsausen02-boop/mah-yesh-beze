name: Weekly essay

# Writes this week's essay and commits it, which republishes the site.
# Sundays at 05:00 Israel time (02:00 UTC in summer, 03:00 in winter — GitHub
# cron is always UTC, so the hour shifts by one when the clocks change).
# You can also run it by hand: Actions → Weekly essay → Run workflow.
on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      date:
        description: "Pretend today is this date (YYYY-MM-DD). Leave empty for today."
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-essay
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet anthropic tzdata

      - name: Write the essay
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          python scripts/weekly_essay.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Commit it
        run: |
          git config user.name "Rav Ezra (bot)"
          git config user.email "actions@github.com"
          git add week.json weeks/
          if git diff --cached --quiet; then
            echo "Nothing changed this week."
            exit 0
          fi
          week=$(python -c "import json;print(json.load(open('week.json'))['week_start'])")
          topic=$(python -c "import json;print(json.load(open('week.json'))['topic_name'])")
          git commit -m "Essay for the week of $week — $topic"
          git push
